name: Refresh PageLens README screenshots (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/readme-preview-refresh.trigger'
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and capture compiled UI
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          npm run build
          npm run test:ui
      - name: Update screenshots and README
        shell: bash
        run: |
          cp docs/screenshots/overview-fixture-preview.png docs/screenshots/pagelens-v1.0.2-overview.png
          cp docs/screenshots/activation-hint-fixture-preview.png docs/screenshots/pagelens-v1.0.2-activation-hint.png
          python - <<'PY'
          from pathlib import Path
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = '![PageLens light theme using a local HTML fixture](docs/screenshots/overview-fixture-preview.webp)\n\n*This is a compiled-UI test preview, not an installed Chrome screenshot.*'
          new = '''![PageLens v1.0.2 Overview — compact white UI with sepia accents](docs/screenshots/pagelens-v1.0.2-overview.png)

          *Preview rendered from compiled PageLens code using a local HTML fixture; not a genuine installed-Chrome screenshot.*

          <details>
          <summary>View the new toolbar activation guidance (v1.0.2)</summary>

          ![PageLens v1.0.2 instruction after navigating to another tab](docs/screenshots/pagelens-v1.0.2-activation-hint.png)

          *Click the PageLens icon again when temporary tab access expires. No ineffective Retry buttons.*

          </details>'''
          if text.count(old) != 1:
              raise RuntimeError('README image section has changed; aborting to avoid overwriting new edits')
          readme.write_text(text.replace(old, new), encoding='utf-8')
          docs = Path('docs/screenshots.md')
          docs.write_text(docs.read_text(encoding='utf-8') + '''
          ## README previews (v1.0.2)

          The README links to versioned overview and activation-hint PNG screenshots,
          rendered by Playwright using compiled PageLens code and a local HTML
          fixture. They are not genuine installed-Chrome screenshots and must not
          be represented as Chrome Web Store screenshots.
          ''', encoding='utf-8')
          PY
          rm -f .github/readme-preview-refresh.trigger .github/workflows/refresh-readme-previews.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md docs/screenshots/ docs/screenshots.md .github
          git commit -m "docs: refresh PageLens v1.0.2 README screenshots"
          git push origin HEAD:main
