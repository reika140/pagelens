<!doctype html><html lang="en"><head><meta charset="utf-8"><base href="https://sample.example/"><title>Link highlighting regression</title></head>
<body><main>
  <a id="follow" href="/about">Regular link</a>
  <a id="nofollow" href="https://other.example/" rel="NoFoLlOw">Nofollow link</a>
  <a id="ugc" href="/forum" rel="ugc nofollow">User-generated link</a>
  <a id="sponsored" href="https://ad.example/" rel="sponsored">Sponsored link</a>
  <a id="mailto" href="mailto:help@sample.example">Email link</a>
  <a id="fragment" href="#local">Local fragment</a>
  <a id="missing">Anchor without href</a>
  <a id="mixed" href="/resource" rel="noopener noreferrer">Ordinary external-nonfollowless link</a>
</main></body></html>
