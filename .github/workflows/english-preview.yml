name: Regenerate English-only PageLens screenshots (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/english-preview.trigger']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and regenerate English fixture screenshots
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          npm run check
          npm run test:serp
          npm run test:auto-serp
          npm run test:ui
      - name: Commit verified screenshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/
          git rm -f .github/workflows/english-preview.yml .github/english-preview.trigger
          git commit -m "docs: regenerate English-only PageLens UI and SERP screenshots"
          git push origin HEAD:main
